# Origin static server for HLS segments. This is the "CDN" whose egress we want to offload.
# Run:  nginx -p $(pwd)/origin -c $(pwd)/origin/nginx.conf
# Serves ./hls at http://localhost:8080/hls/stream.m3u8
#
# CORS is wide-open because viewers on a different origin (the web/ static host) fetch
# segments cross-origin, and p2p-media-loader also fetches them as the HTTP fallback.
worker_processes 1;
events { worker_connections 256; }

http {
  default_type  application/octet-stream;
  # sendfile is buggy on Windows with files that get rewritten/rotated (live HLS
  # segments) — nginx caches a stale/zero handle and 404s. Keep off on Windows.
  sendfile      off;
  # Temp paths under the prefix (origin/) so no admin-owned default dirs are touched.
  client_body_temp_path temp/client;
  proxy_temp_path       temp/proxy;
  fastcgi_temp_path     temp/fastcgi;
  uwsgi_temp_path       temp/uwsgi;
  scgi_temp_path        temp/scgi;

  # Access log with bytes-sent field last -> ground-truth origin egress per request.
  # Sum $body_bytes_sent for /hls/* to cross-check the P2P offload dashboard.
  log_format egress '$time_iso8601 $request_uri $status $body_bytes_sent';
  access_log logs/egress.log egress;

  types {
    application/vnd.apple.mpegurl m3u8;
    video/iso.segment            m4s;
    video/mp4                    mp4;
  }

  server {
    listen 8080;
    # `_` is a catch-all: accept any Host header, so a viewer on another machine can
    # request http://<lan-ip>:8080/hls/... . With `localhost` here, that request would
    # not match this server block. `listen 8080` already binds all interfaces.
    server_name _;

    location /hls/ {
      # hls/ dir sits next to this conf (prefix = origin/ from -p flag)
      alias hls/;
      add_header Access-Control-Allow-Origin  "*" always;
      add_header Access-Control-Allow-Headers "Range" always;
      add_header Access-Control-Expose-Headers "Content-Length" always;
      # Live playlist changes constantly; never cache it. Segments are immutable.
      add_header Cache-Control "no-cache" always;
    }
  }
}
