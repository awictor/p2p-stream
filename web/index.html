<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>P2P Live Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- hls.js (MSE player) + p2p-media-loader IIFE build. p2p engine plugs in as a
       custom loader: segment bytes arrive from peers over WebRTC or from origin over
       HTTP, then get appended to MSE exactly as normal hls.js playback. -->
  <script src="./vendor/hls.min.js"></script>
  <script src="./vendor/p2pml-hlsjs.iife.min.js"></script>
  <script src="./p2p-config.js"></script>
  <style>
    body { font:15px/1.5 system-ui,sans-serif; background:#0e1116; color:#e6edf3; margin:0; padding:1.5rem; }
    video { width:100%; max-width:720px; background:#000; border-radius:8px; }
    .row { display:flex; gap:1rem; flex-wrap:wrap; margin-top:1rem; max-width:720px; }
    .stat { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:.6rem .9rem; flex:1; min-width:120px; }
    .stat .k { font-size:.72rem; color:#8b949e; text-transform:uppercase; }
    .stat .v { font-size:1.3rem; font-weight:600; }
    #peers { color:#3fb950; }
    small { color:#8b949e; }
  </style>
</head>
<body>
  <video id="video" controls autoplay muted playsinline></video>
  <div class="row">
    <div class="stat"><div class="k">This viewer offload</div><div class="v" id="ratio">0%</div></div>
    <div class="stat"><div class="k">Peers connected</div><div class="v" id="peers">0</div></div>
    <div class="stat"><div class="k">HTTP bytes</div><div class="v" id="http">0</div></div>
    <div class="stat"><div class="k">P2P down</div><div class="v" id="p2pd">0</div></div>
    <div class="stat"><div class="k">P2P up</div><div class="v" id="p2pu">0</div></div>
  </div>
  <p><small>Open this page in several tabs/machines on the same stream, then watch the
    <a href="http://localhost:8001" style="color:#58a6ff">dashboard</a>. Offload climbs with viewer count.</small></p>

  <script>
    const cfg = window.P2P_DEMO;
    // Random per-viewer id for the metrics dashboard.
    // crypto.randomUUID() exists ONLY in a secure context, so on a plain-http LAN URL
    // (exactly the cross-machine case) it is undefined and calling it throws
    // "crypto.randomUUID is not a function" BEFORE the player is set up — which killed
    // every off-localhost viewer. getRandomValues is also secure-context-only, hence the
    // Math.random tail. This id only has to be unique among concurrent viewers, so a
    // weak fallback is fine; nothing security-relevant depends on it.
    const clientId = (() => {
      if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      if (window.crypto && typeof crypto.getRandomValues === "function") {
        const a = new Uint8Array(16);
        crypto.getRandomValues(a);
        return [...a].map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      return `v-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    })();

    // Browser identity (P2P-0082): an ed25519 keypair so this viewer can SIGN its reports and earn
    // the certified/receipted credit tiers the server verifies (server/identity.js). Interop is
    // exact — spike P2P-0081 proved crypto.subtle exportKey("spki") base64 == node's spki (44-byte
    // pubkey) and crypto.subtle.sign({name:"Ed25519"}) == node's 64-byte detached sig, over the SAME
    // UTF-8 canonical bytes — so `canonicalize` here MUST byte-match server/identity.js canonicalize:
    // sorted keys at every level, recursive, undefined dropped, scalars via JSON.stringify.
    const canonicalize = (obj) => {
      if (obj === null || typeof obj !== "object") return JSON.stringify(obj);
      if (Array.isArray(obj)) return "[" + obj.map(canonicalize).join(",") + "]";
      const keys = Object.keys(obj).filter((k) => obj[k] !== undefined).sort();
      return "{" + keys.map((k) => JSON.stringify(k) + ":" + canonicalize(obj[k])).join(",") + "}";
    };
    const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    // crypto.subtle + Ed25519 need a SECURE CONTEXT (https or localhost). On a plain-http LAN URL it
    // is absent — GUARD like clientId above so an unsupported browser NEVER throws pre-player; the
    // viewer just runs unsigned (still counted for offloadRatio, not eligible for a payable tier).
    // window.__identity resolves to {pubKey, sign(obj)->b64 sig} or null; __identityReady awaits it.
    let __identity = null;
    window.__identity = null;
    window.__identityReady = (async () => {
      try {
        if (!(window.isSecureContext && window.crypto && crypto.subtle)) return null;
        const kp = await crypto.subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]);
        const spki = await crypto.subtle.exportKey("spki", kp.publicKey);
        const pubKey = b64(spki);
        const enc = new TextEncoder();
        const sign = async (obj) =>
          b64(await crypto.subtle.sign({ name: "Ed25519" }, kp.privateKey, enc.encode(canonicalize(obj))));
        __identity = { pubKey, sign };
        window.__identity = __identity;
        return __identity;
      } catch (e) {
        // Ed25519 unsupported (older engine): stay unsigned rather than killing the player.
        return null;
      }
    })();

    // Cumulative counters for THIS viewer. p2p-media-loader reports per-segment.
    let httpBytes = 0, p2pBytes = 0, uploadBytes = 0, peers = 0;

    // Upload budget: stop relaying once we have served this many bytes. Null = uncapped.
    const uploadCapBytes = cfg.uploadCapMB ? cfg.uploadCapMB * 1e6 : null;
    let uploadCapped = false;

    // peerId -> bytes THAT PEER SERVED US. Cumulative, reported to the metrics server so a
    // peer's upload can be credited by its receivers instead of by its own claim.
    const servedByPeer = Object.create(null);

    // Our own engine peer id, so the server can join attested credit to this viewer. Verified
    // reachable at `engine.core.peerId` (probed live — it is not on the engine itself, and
    // there is no public getter, so read it defensively and tolerate null).
    const ownPeerId = () => {
      try { return window.__hls.p2pEngine.core.peerId || null; } catch { return null; }
    };

    // Per-segment fetch ledger, to attribute the total-byte gap between P2P on and off.
    // `fetches` counts delivery EVENTS; `seen` holds one entry per distinct segment URL.
    // If fetches > seen, some segment was delivered more than once — and `dupBytes` is how
    // much that cost. If they are equal, the extra bytes were distinct segments instead.
    // Exposed on window for the harness; nothing in the UI depends on it.
    const seen = new Map();   // url -> { count, bytes, sources:Set, startTime, endTime, played }
    let fetches = 0, dupFetches = 0, dupBytes = 0;
    function track(url, source, len, startTime, endTime) {
      fetches++;
      if (!url) return;       // no URL means we cannot dedupe; counted in fetches only
      const prev = seen.get(url);
      if (prev) {
        prev.count++; prev.bytes += len; prev.sources.add(source);
        dupFetches++; dupBytes += len;
      } else {
        // startTime/endTime come from the engine's segment object and are what make
        // "was this segment ever actually played?" answerable. Undefined for the P2P-off
        // arm (hls.js's FRAG_LOADED path supplies them separately).
        seen.set(url, {
          count: 1, bytes: len, sources: new Set([source]),
          startTime, endTime, played: false,
        });
      }
    }

    // WAS IT PLAYED? The 1.55x amplification is attributed to "read-ahead or discard", but
    // nobody had counted which — and that count decides whether the window can be tuned down
    // at all. A segment counts as played once the playhead has passed its start; polling on
    // timeupdate is enough because we only need "did the playhead ever reach here", not a
    // frame-exact answer. Marking is monotonic (never un-played) so a seek cannot undo it.
    function markPlayed() {
      const v = document.querySelector("video");
      if (!v) return;
      const t = v.currentTime;
      for (const s of seen.values()) {
        if (s.played) continue;
        // A segment is played once the playhead reaches its start. Using startTime (not
        // endTime) avoids counting the segment currently mid-render as wasted.
        if (typeof s.startTime === "number" && t >= s.startTime) s.played = true;
      }
    }

    window.__ledger = () => {
      // Which duplicates crossed transports (http AND p2p delivered the same segment) vs
      // repeated on one — that distinguishes "the two loaders raced" from "one loader
      // refetched". Different bugs, same byte total.
      markPlayed();
      const v = document.querySelector("video");
      const t = v ? v.currentTime : 0;
      // Is a segment's range inside what the media element currently holds? A fetched segment
      // that is ahead of the playhead AND buffered will be played — it is pending, not wasted.
      // One that is ahead but NOT buffered was fetched and never appended to MSE: that is the
      // only thing that can honestly be called wasted.
      const buffered = (s, e) => {
        if (!v || !v.buffered) return false;
        for (let i = 0; i < v.buffered.length; i++) {
          // Tolerance because segment boundaries and buffered ranges rarely align exactly.
          if (s >= v.buffered.start(i) - 0.5 && s <= v.buffered.end(i) + 0.5) return true;
        }
        return false;
      };
      let crossTransport = 0, played = 0, pending = 0, wasted = 0, wastedBytes = 0, noTiming = 0;
      for (const s of seen.values()) {
        if (s.count > 1 && s.sources.size > 1) crossTransport++;
        if (typeof s.startTime !== "number") { noTiming++; continue; }
        if (s.played) { played++; continue; }
        // NOT-YET-PLAYED splits two ways, and conflating them was a real error: counting
        // everything ahead of the playhead as "wasted" made the HTTP-only control arm read
        // 51% wasted, which is impossible — it was just its end-of-run buffer. A run that is
        // cut off always leaves a full buffer of unplayed segments; that is truncation, not cost.
        if (buffered(s.startTime, s.endTime)) pending++;
        else { wasted++; wastedBytes += s.bytes; }
      }
      return {
        fetches, unique: seen.size, dupFetches, dupBytes, crossTransport,
        // `noTiming` is reported rather than folded into either bucket: a segment we cannot
        // time is unknown, not wasted, and quietly calling it wasted would manufacture the
        // very result this measurement exists to test.
        played, pending, wasted, wastedBytes, noTiming,
        httpBytes, p2pBytes,
      };
    };

    const fmt = (b) => {
      if (b < 1024) return b + " B";
      const u = ["KB","MB","GB"]; let i = -1;
      do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
      return b.toFixed(1) + " " + u[i];
    };
    function paint() {
      const total = httpBytes + p2pBytes;
      document.getElementById("ratio").textContent = total ? Math.round((p2pBytes/total)*100)+"%" : "0%";
      document.getElementById("peers").textContent = peers;
      document.getElementById("http").textContent = fmt(httpBytes);
      document.getElementById("p2pd").textContent = fmt(p2pBytes);
      // Show the cap alongside the number. Consent needs a visible figure and a visible stop —
      // "ad-free if you relay" without showing what relaying costs is a dark pattern.
      document.getElementById("p2pu").textContent = fmt(uploadBytes) +
        (uploadCapBytes !== null ? (uploadCapped ? " (capped)" : ` / ${cfg.uploadCapMB}MB`) : "");
    }

    if (window.Hls && Hls.isSupported()) {
      const HlsJsP2PEngine = window.p2pml.hlsjs.HlsJsP2PEngine;
      const HlsWithP2P = HlsJsP2PEngine.injectMixin(window.Hls);

      const hls = new HlsWithP2P({
        // The engine's two buffer auto-tunes are guarded SEPARATELY, which is the whole
        // trick here (engine source):
        //   !userConfig.liveSyncDuration && !userConfig.liveSyncDurationCount
        //     -> liveSyncDurationCount = min(fragments-1, floor(60/targetduration))
        //   !userConfig.maxBufferLength && !userConfig.maxMaxBufferLength
        //     -> maxBufferLength = max(targetduration*2, highDemandTimeWindow), and it only
        //        ever LOWERS the value
        //
        // Two core gates must BOTH be satisfied for P2P to engage:
        //   (1) jr(): segmentsAhead > 5, else both download windows are zeroed
        //   (2) a segment must sit outside highDemandTimeWindow (default 15s) to be P2P-eligible
        //
        // Letting BOTH auto-tunes run can never satisfy them: maxBufferLength becomes
        // max(2*td, hd), so either buffer == hd (gate 2 fails) or buffer == 2*td, i.e. only
        // 2 segments ahead (gate 1 fails). No -hls_time value escapes that.
        //
        // So: leave liveSyncDurationCount UNSET (the auto-tune parks us ~60 segments back from
        // the live edge on a 90-fragment playlist, giving depth to buffer into) but set
        // maxBufferLength ourselves, suppressing only the tune that would clamp it to 15.
        //
        // NOTE (measured iter 2): maxBufferLength is NOT the binding constraint on a live
        // stream. hls.js holds the live sync point (latency 121.1 vs targetLatency 120 = LSDC
        // 60 x td 2) and refuses to run further ahead, so the buffer plateaus at ~15.4s
        // regardless. Kept because it removes the engine's clamp; it just isn't the lever.
        maxBufferLength: 60,
        // lowLatencyMode: false was tried at iter 5 and is DEAD — the buffer stayed at
        // 14.4/15.4s and `latency` stayed pinned at 121.1, identical to lowLatencyMode:true.
        // The pin comes from liveSyncDurationCount, which applies either way; LLHLS chasing
        // was never the cause. Reverted rather than pay live latency for nothing.
        p2p: {
          core: {
            swarmId: cfg.swarmId,
            announceTrackers: cfg.announceTrackers,
            rtcConfig: { iceServers: cfg.iceServers },
            // CONTROL ARM (?p2p=off). Both keys are top-level baseConfig keys that the
            // engine merges into mainStreamConfig/secondaryStreamConfig, so setting them
            // here covers both streams:
            //   isP2PDisabled       -> isSegmentLoadable() returns false, so every segment
            //                          is fetched over HTTP
            //   isP2PUploadDisabled -> we serve nothing to peers either
            // The engine is deliberately still INSTANTIATED and still announces; only P2P
            // transfer is off. That keeps the control arm the same code path with one
            // variable flipped, instead of comparing against a different player entirely.
            isP2PDisabled: !cfg.p2pEnabled,
            isP2PUploadDisabled: !cfg.p2pEnabled,
            // DO NOT lower highDemandTimeWindow to widen the P2P margin — measured dead at
            // iter 3. The buffer is sized FROM it (maxBufferLength auto-tune = max(2*td, hd)),
            // so lowering hd lowers the buffer by the same amount and the P2P-eligible slice
            // stays pinned at ~0.4s: hd=15 -> buffer 15.4 (segsAhead 7.7), hd=8 -> buffer 8.4
            // (segsAhead 4.2, which then trips gate 1). The two gates are structurally coupled
            // through hd; the margin cannot be widened from this knob.
            // Other download-window defaults are left alone on purpose. They interact with the
            // buffer auto-tune above; hand-tuning them was part of what kept P2P off.
            //
            // ?p2pWindow=<s> narrows p2pDownloadTimeWindow (default 6000s). This is a DIFFERENT
            // knob from highDemandTimeWindow above: hd decides HTTP-vs-P2P near the playhead and
            // is coupled to buffer size, whereas p2pDownloadTimeWindow only bounds how far AHEAD
            // a segment may be and still be P2P-eligible. Narrowing it should cut the fetches
            // that are never played (33%, iter 31) without touching the buffer. Spread only when
            // set, so the engine default is untouched on a normal run.
            ...(cfg.p2pWindowS ? { p2pDownloadTimeWindow: cfg.p2pWindowS } : {}),
            // ?p2pMaxPeers raises the peer cap (engine default 50). Past the cap the engine evicts
            // peers slowest-bandwidth-first every 30s, so a sweep point above it would measure
            // eviction policy rather than scaling. Measured iter 49: at N=8/12/16 connects ran
            // 50/90/134 with the cap at 200, so the flat tail is NOT the cap — see p2p-config.js.
            ...(cfg.p2pMaxPeers ? { p2pMaxPeers: cfg.p2pMaxPeers } : {}),
          },
          onHlsJsCreated(hls) {
            const eng = hls.p2pEngine;
            // Each loaded segment tells us where its bytes came from.
            eng.addEventListener("onSegmentLoaded", (d) => {
              const len = d.bytesLength || d.byteLength || 0;
              if (d.downloadSource === "p2p") {
                p2pBytes += len;
                // RECEIVER ATTESTATION: record who served us and how much. This is a
                // third-party witness to their upload, which is the only version of the
                // number a reward tier could act on — a peer's claim about itself is
                // forgeable in one line. See the threat note in server/metrics.js.
                if (d.peerId) servedByPeer[d.peerId] = (servedByPeer[d.peerId] || 0) + len;
              }
              else httpBytes += len; // "http" (origin) or anything non-p2p
              // Per-segment ledger. With P2P on, 4 viewers fetched 1.52x the bytes the
              // HTTP-only arm needed for the SAME video and the SAME buffer depth, and the
              // cause was unattributed. Counting EVENTS vs UNIQUE segment URLs separates the
              // three candidates that look identical in a byte total:
              //   events > unique          -> the same segment was delivered twice (real waste,
              //                               or the same load reported twice = double-count)
              //   events == unique         -> every fetch was a distinct segment, so the extra
              //                               bytes are real distinct data (read-ahead/discard)
              // Keyed by URL because that is what identifies a segment to both loaders.
              track(d.segmentUrl || d.segment?.url, d.downloadSource, len,
                d.segment?.startTime, d.segment?.endTime);
              paint();
            });
            // CONTROL ARM ACCOUNTING. With isP2PDisabled the engine's loader checks
            // isSegmentLoadable(), sees false, delegates to hls.js's DEFAULT loader and
            // returns early — so loadSegment() never runs and onSegmentLoaded NEVER FIRES.
            // The handler above therefore counts nothing, and the control arm reported
            // "0 MB origin bytes", which is blindness masquerading as a measurement: it made
            // P2P-off look free when it is the expensive arm. hls.js's own FRAG_LOADED fires
            // whichever loader ran, so use it when P2P is off. Only ONE of the two paths is
            // ever active, so there is no double counting.
            if (!cfg.p2pEnabled) {
              hls.on(window.Hls.Events.FRAG_LOADED, (_e, d) => {
                const len = (d && d.frag && d.frag.stats && d.frag.stats.total)
                  || (d && d.payload && d.payload.byteLength) || 0;
                httpBytes += len;
                // Same ledger for the control arm, or the two arms aren't comparable. The off
                // arm is expected at ~1.0 fetches/segment, which is what makes it the baseline.
                // hls.js's own fragment carries start/duration rather than start/end, so the
                // control arm gets the same timing basis as the P2P arm and the two
                // never-played counts stay comparable.
                track(d && d.frag && d.frag.url, "http", len,
                  d && d.frag && d.frag.start,
                  d && d.frag && (d.frag.start + (d.frag.duration || 0)));
                paint();
              });
            }
            // Bytes WE served to other peers (our contribution to offloading origin).
            // There is NO "onSegmentUploaded" event — upload is reported per CHUNK, and the
            // handler receives POSITIONAL args, not an object:
            //   onChunkUploaded(bytesLength, peerId, streamType, infoHash)
            // Listening on the wrong name with an object destructure is why this read 0 B
            // for every viewer while tens of MB were actually being served.
            // The full engine event list is: onChunkDownloaded, onChunkUploaded,
            // onPeerConnect, onPeerConnectError, onPeerClose, onPeerError, onPeerWarning,
            // onTrackerWarning, onTrackerError, onSegmentError, onSegmentAbort,
            // onSegmentStart, onSegmentLoaded.
            eng.addEventListener("onChunkUploaded", (bytesLength) => {
              uploadBytes += Number(bytesLength) || 0;
              // UPLOAD BUDGET (?uploadCapMB). Consent is the only lever left on the viewer's
              // cost — narrowing the download window was measured dead at iter 33 because it
              // cuts the origin saving just as fast. So let the viewer bound what they spend.
              //
              // Stops UPLOAD only: this viewer keeps downloading from peers and keeps playing,
              // it just stops serving. Disabling download instead would push it back onto the
              // origin and defeat the point.
              //
              // ⚠ THIS IS NOT AN ANTI-ABUSE CONTROL. `uploadBytes` is a page-side counter, so a
              // modified client can under-report it and relay forever, or over-report it and
              // claim credit for bytes it never sent. It bounds an HONEST viewer's bill; it does
              // not defend the platform against a dishonest one. Any reward tier built on this
              // number needs proof-of-delivery from the RECEIVING peer, not self-reporting.
              if (uploadCapBytes !== null && !uploadCapped && uploadBytes >= uploadCapBytes) {
                uploadCapped = true;
                try {
                  // Runtime toggle, verified in the vendored engine: applyDynamicConfig ->
                  // core.applyDynamicConfig, and getUpdatedStreamProperty falls back to the
                  // top-level key, so this covers main and secondary streams.
                  eng.applyDynamicConfig({ core: { isP2PUploadDisabled: true } });
                } catch (e) {
                  console.log(`P2PWARN upload cap could not be applied: ${e && e.message}`);
                }
              }
              paint();
            });
            eng.addEventListener("onPeerConnect", () => { peers++; paint(); });
            eng.addEventListener("onPeerClose", () => { peers = Math.max(0, peers-1); paint(); });
          },
        },
      });

      window.__hls = hls; // expose for debugging/inspection
      // The harness reads this to assert the control arm really is the arm it asked for.
      // Without it, a broken flag would silently produce two identical P2P-on runs and
      // the comparison would look like "P2P makes no difference".
      window.__p2pEnabled = cfg.p2pEnabled;
      // Report the window the engine ACTUALLY applied, read back from its own config rather than
      // echoing what we asked for. A sweep whose knob silently failed would print a table of
      // identical rows and read as "tuning makes no difference" — the most misleading result
      // available. Same lesson as asserting the control arm is really the control arm.
      // Engine shape (verified in vendor source): HlsJsP2PEngine.getConfig() returns
      // { core: {...commonCoreConfig, mainStream, secondaryStream} }.
      // Upload-budget state, read back from the ENGINE rather than echoing our own flag — a cap
      // that silently failed to apply would look identical to a cap that worked but was never
      // reached, and the harness must be able to tell those apart.
      window.__uploadCap = () => {
        let engineDisabled = null;
        try {
          engineDisabled = hls.p2pEngine.getConfig().core.mainStream.isP2PUploadDisabled;
        } catch { /* engine not ready */ }
        return { capMB: cfg.uploadCapMB, capped: uploadCapped, uploadBytes, engineDisabled };
      };
      window.__p2pWindow = () => {
        try {
          return hls.p2pEngine.getConfig().core.mainStream.p2pDownloadTimeWindow;
        } catch { return null; }
      };
      // Same readback rule for the peer cap: prove the knob APPLIED rather than echoing what we
      // asked for. A sweep whose cap silently failed would measure the default and read as
      // "raising the cap changes nothing" — the most misleading result available.
      window.__p2pMaxPeers = () => {
        try {
          return hls.p2pEngine.getConfig().core.mainStream.p2pMaxPeers;
        } catch { return null; }
      };
      const videoEl = document.getElementById("video");
      // Mark segments played as the playhead moves, not only when the ledger is read. A live
      // playlist evicts old fragments, and on a long run the playhead passes segments well
      // before anyone asks — marking lazily would count those as never-played and invent waste.
      videoEl.addEventListener("timeupdate", markPlayed);
      hls.attachMedia(videoEl);
      hls.loadSource(cfg.streamUrl);
    } else {
      document.body.insertAdjacentHTML("beforeend",
        "<p style='color:#f85149'>hls.js/MSE not supported in this browser.</p>");
    }

    // Report cumulative counters to the dashboard aggregator.
    setInterval(() => {
      fetch(cfg.metricsUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // Date.now() is fine in the browser; the tracker/metrics server never runs
        // inside a workflow sandbox, so no restriction here.
        // `peerId` lets the server map an attested credit onto a tracked viewer — the engine's
        // peer id and our clientId are otherwise unrelated namespaces. `attest` is our
        // third-party witness of what OTHER peers served us.
        body: JSON.stringify({
          clientId, httpBytes, p2pBytes, uploadBytes, ts: Date.now(),
          peerId: ownPeerId(), attest: servedByPeer,
        }),
      }).catch(() => {});
    }, cfg.reportIntervalMs);
  </script>
</body>
</html>
