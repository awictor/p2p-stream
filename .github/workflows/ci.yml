name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # Self-contained unit suite (excludes the two nginx-binary tests). See scripts/test-ci.mjs.
      - run: npm run test:ci
