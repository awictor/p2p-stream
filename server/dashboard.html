<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>P2P Offload Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    body { font: 16px/1.5 system-ui, sans-serif; background:#0e1116; color:#e6edf3; margin:0; padding:2rem; }
    h1 { font-size:1.3rem; margin:0 0 1.5rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; max-width:820px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:1.1rem 1.2rem; }
    .card .label { font-size:.8rem; color:#8b949e; text-transform:uppercase; letter-spacing:.04em; }
    .card .val { font-size:1.9rem; font-weight:600; margin-top:.3rem; }
    .offload { grid-column:1/-1; }
    .offload .val { font-size:3.2rem; color:#3fb950; }
    .bar { height:14px; border-radius:7px; background:#30363d; overflow:hidden; margin-top:.8rem; }
    .bar > span { display:block; height:100%; background:linear-gradient(90deg,#238636,#3fb950); width:0; transition:width .4s; }
    small { color:#8b949e; }
  </style>
</head>
<body>
  <h1>P2P Live Streaming — Bandwidth Offload <small>(polls /stats every 2s)</small></h1>
  <div class="grid">
    <div class="card offload">
      <div class="label">Offload ratio — bytes served peer-to-peer vs origin</div>
      <div class="val" id="offload">0%</div>
      <div class="bar"><span id="bar"></span></div>
    </div>
    <div class="card"><div class="label">Active viewers</div><div class="val" id="viewers">0</div></div>
    <div class="card"><div class="label">Origin (HTTP) bytes</div><div class="val" id="http">0</div></div>
    <div class="card"><div class="label">P2P download bytes</div><div class="val" id="p2p">0</div></div>
    <div class="card"><div class="label">P2P upload bytes</div><div class="val" id="upload">0</div></div>
  </div>

  <script>
    const fmt = (b) => {
      if (b < 1024) return b + " B";
      const u = ["KB","MB","GB","TB"]; let i = -1;
      do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
      return b.toFixed(1) + " " + u[i];
    };
    async function tick() {
      try {
        const s = await (await fetch("/stats")).json();
        const pct = Math.round(s.offloadRatio * 100);
        document.getElementById("offload").textContent = pct + "%";
        document.getElementById("bar").style.width = pct + "%";
        document.getElementById("viewers").textContent = s.viewers;
        document.getElementById("http").textContent = fmt(s.httpBytes);
        document.getElementById("p2p").textContent = fmt(s.p2pBytes);
        document.getElementById("upload").textContent = fmt(s.uploadBytes);
      } catch (e) { /* server restart etc; keep polling */ }
    }
    setInterval(tick, 2000); tick();
  </script>
</body>
</html>
